<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Outfit;src:url("../../assets/fonts/Outfit.ttf");font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:2160px;overflow:hidden;font-family:Outfit,sans-serif;position:relative;background:linear-gradient(160deg,#3F6240 0%,#173424 55%,#0F2A1D 100%);color:#E3EED4}
.glow{position:absolute;left:-200px;top:520px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(217,242,107,.22),rgba(217,242,107,0) 65%)}
h1{position:absolute;left:0;right:0;top:92px;text-align:center;font-size:96px;line-height:1.04;font-weight:700;letter-spacing:-2px}
h1 em{font-style:normal;color:#D9F26B}
.sub{position:absolute;left:0;right:0;top:332px;text-align:center;font-size:40px;font-weight:500;color:#AEC3B0}
.phone{position:absolute;left:140px;top:420px;width:800px;height:1740px;border-radius:84px 84px 0 0;background:#08140d;padding:14px 14px 0;box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 3px rgba(227,238,212,.12)}

</style></head><body><div class="glow"></div><h1 id="h"></h1><div class="sub" id="s"></div><div class="phone"><img id="i"></div>
<script>
const D=[
 ["Reclaim space<br><em>in one tap</em>","","01_home"],
 ["Delete <em>duplicate</em><br>photos","","02_dups"],
 ["Keep the <em>best</em>,<br>clear the rest","","03_similar"],
 ["Clear <em>blurry</em><br>photos","","04_blurry"],
 ["<em>Compress</em> photos<br>&amp; videos","","05_compress"],
 ["Merge <em>duplicate</em><br>contacts","","06_contacts"],
 ["Clean old<br><em>calendar events</em>","","07_events"],
 ["<em>Lock</em> private photos<br>&amp; contacts","100% on-device · No account","08_secret"]];
